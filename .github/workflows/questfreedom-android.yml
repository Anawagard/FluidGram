name: QuestFreedom prototype APK and emulator smoke
on:
  push:
    branches: [questfreedom-aosp-poc-20261102]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform and build-tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Build and unit tests
        run: gradle -p questfreedom --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: QuestFreedomLauncher-debug
          path: questfreedom/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke (not Horizon OS)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: default
          profile: pixel_4
          script: |
            adb install -r questfreedom/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n org.questfreedom.launcher/org.questfreedom.ui.MainActivity
            adb shell pidof org.questfreedom.launcher
