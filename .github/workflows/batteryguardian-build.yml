name: Battery Guardian APK
on:
  push:
    branches: [battery-guardian-shizuku-build]
    paths:
      - 'BatteryGuardian/**'
      - '.github/workflows/batteryguardian-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses < /dev/zero || true
          $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle -p BatteryGuardian :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BatteryGuardian-debug-apk
          path: BatteryGuardian/app/build/outputs/apk/debug/*.apk
