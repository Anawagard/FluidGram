name: Battery Guardian APK
on:
  push:
    branches: [battery-guardian-shizuku-build]
    paths:
      - 'BatteryGuardian/**'
      - '.github/workflows/batteryguardian-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android SDK
        run: |
          ls -la "$ANDROID_HOME" || true
          find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f || true
          ls -la "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle -p BatteryGuardian :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BatteryGuardian-debug-apk
          path: BatteryGuardian/app/build/outputs/apk/debug/*.apk
